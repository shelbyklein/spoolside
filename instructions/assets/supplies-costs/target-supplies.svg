<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="DM Sans, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#f3f6f5"/>
  <rect x="0" y="0" width="200" height="760" fill="#1d6b75"/>
  <text x="24" y="48" fill="#fff" font-size="22" font-weight="700">spoolside.</text>
  <g fill="#e6f2f3" font-size="15"><text x="24" y="110">Overview</text><text x="24" y="150">Printers</text><text x="24" y="190">PlayCase</text><text x="24" y="230">Queue</text></g>
  <rect x="14" y="252" width="172" height="36" rx="8" fill="#ffffff33"/>
  <text x="24" y="276" fill="#fff" font-size="15" font-weight="700">Supplies</text>
  <text x="24" y="320" fill="#e6f2f3" font-size="15">Settings</text>

  <text x="240" y="62" font-size="32" font-weight="700" fill="#16313a">Supplies</text>
  <g font-size="14" fill="#16313a">
    <rect x="240" y="88" width="96" height="32" rx="16" fill="#16313a"/><text x="262" y="109" fill="#fff">Filament</text>
    <rect x="346" y="88" width="80" height="32" rx="16" fill="#fff" stroke="#c9d6d4"/><text x="370" y="109">Parts</text>
    <rect x="436" y="88" width="104" height="32" rx="16" fill="#fff" stroke="#c9d6d4"/><text x="458" y="109">Packaging</text>
    <rect x="1020" y="88" width="140" height="32" rx="8" fill="#fff" stroke="#c9d6d4"/><text x="1044" y="109">+ Add supply</text>
  </g>

  <!-- Parts tab content -->
  <g transform="translate(240,140)">
    <rect width="920" height="250" rx="14" fill="#fff" stroke="#dbe5e3"/>
    <text x="22" y="38" font-size="20" font-weight="700" fill="#16313a">Magnets, 3 × 2 mm</text>
    <text x="22" y="62" font-size="13" fill="#5b6f74">Bought part · counted in pieces · used in 6 assemblies (24 per case, 12 or 10 per faceplate top)</text>
    <rect x="22" y="80" width="876" height="1" fill="#e3ebe9"/>
    <text x="22" y="112" font-size="15" font-weight="700" fill="#16313a">Amazon · MEALOS</text>
    <text x="22" y="134" font-size="13" fill="#5b6f74">200 pcs 3mm × 2mm round magnets</text>
    <text x="380" y="112" font-size="15" font-weight="700" fill="#16313a">$8.99 for 200</text>
    <text x="380" y="134" font-size="13" fill="#5b6f74">$0.045 / piece</text>
    <text x="600" y="112" font-size="13" fill="#5b6f74">Price confirmed Nov 10</text>
    <text x="600" y="134" font-size="13" fill="#1d6b75">Confirm price / stock</text>
    <rect x="820" y="98" width="78" height="34" rx="8" fill="#fff" stroke="#c9d6d4"/><text x="842" y="120" font-size="14" fill="#16313a">Buy ↗</text>
    <text x="22" y="190" font-size="20" font-weight="700" fill="#16313a">Rubber bands, 1/8″ heavy</text>
    <text x="22" y="214" font-size="13" fill="#5b6f74">Bought part · pieces · 2 per case · LA MIERE 300 for $7.99 · $0.027 / piece</text>
  </g>

  <!-- Assembly cost panel -->
  <g transform="translate(240,410)">
    <rect width="920" height="320" rx="14" fill="#fff" stroke="#dbe5e3"/>
    <text x="22" y="38" font-size="20" font-weight="700" fill="#16313a">Handheld · cost per unit</text>
    <text x="760" y="38" font-size="24" font-weight="700" fill="#1d6b75">$1.62</text>
    <g font-size="14" fill="#16313a">
      <text x="22" y="80">Handheld – Top</text><text x="380" y="80" fill="#5b6f74">14.1 g Bambu TPU for AMS × $0.0234/g</text><text x="800" y="80">$0.33</text>
      <text x="22" y="110">Handheld – Bottom</text><text x="380" y="110" fill="#5b6f74">6.2 g Bambu TPU for AMS</text><text x="800" y="110">$0.15</text>
      <text x="22" y="140">Faceplate bridge</text><text x="380" y="140" fill="#5b6f74">1.6 g Proto-pasta Conductive PLA</text><text x="800" y="140">$0.09</text>
      <text x="22" y="170">Buttons, membranes, touch pins</text><text x="380" y="170" fill="#b0613a">3 parts have no sliced print yet</text><text x="800" y="170" fill="#b0613a">—</text>
      <text x="22" y="200">Magnets ×12</text><text x="380" y="200" fill="#5b6f74">12 × $0.045</text><text x="800" y="200">$0.54</text>
    </g>
    <rect x="22" y="222" width="876" height="1" fill="#e3ebe9"/>
    <text x="22" y="252" font-size="13" fill="#5b6f74">Printed parts: their share of the sliced plate's grams (split by part volume) × the plate filament's best delivered price.</text>
    <text x="22" y="274" font-size="13" fill="#5b6f74">Bought parts: quantity × price per piece. Missing prices or prints are listed, never counted as $0.</text>
    <text x="22" y="300" font-size="12" fill="#8a9a9e">Illustrative numbers — the real ones come from the sliced jobs and supply offers.</text>
  </g>
</svg>
