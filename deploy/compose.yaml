name: spoolside
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3110:3000"
    volumes:
      - spoolside-data:/data
      - ./woocommerce.json:/run/spoolside/woocommerce.json:ro
      - ./printers.json:/run/spoolside/printers.json:ro
      - ../backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  spoolside-data:
